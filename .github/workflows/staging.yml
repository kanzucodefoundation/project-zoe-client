name: Staging - Build and deploy Project Zoe client

on:
  push:
    branches: [ develop ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-client-vite-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test:run

      - name: Create .env file
        run: echo "VITE_API_URL=https://staging-app.projectzoe.org/server/" > ./.env

      - name: Build
        run: npm run build

      - name: Archive npm failure logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: npm-logs
          path: ~/.npm/_logs

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
        run: |
          mkdir -p ~/.ssh/
          echo "$SERVER_SSH_KEY" > ~/.ssh/projectzoe.key
          chmod 600 ~/.ssh/projectzoe.key
          cat >> ~/.ssh/config << EOF
          Host projectzoe-prod
            HostName $SERVER_HOST
            User $SERVER_USERNAME
            IdentityFile ~/.ssh/projectzoe.key
            StrictHostKeyChecking no
          EOF

      - name: Deploy
        run: rsync -rtvO --delete ./dist/ projectzoe-prod:/opt/projectzoe/staging/client/dist/
